<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Register</title>
</head>

<body>

    <!-- Header -->
    <header>

        <h1>STUDENTHUB</h1>

    </header>


    


    <!-- Main Content -->
    <main>

        <div>

            [ LOGO / ICON ]

        </div>


        <h2>CREATE YOUR ACCOUNT</h2>

        <p>Sign up to get started</p>


        <!-- Registration Form -->
        <section>

            <form>

                <p>
                    [ CONTINUE WITH GOOGLE ]
                </p>

                <p>
                    -------- OR --------
                </p>


                <label for="email">
                    Email
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="[ Enter Email ]"
                >

                <br><br>


                <label for="password">
                    Password
                </label>

                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="[ Enter Password ]"
                >

                <br><br>


                <label for="confirm-password">
                    Confirm Password
                </label>

                <br>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="[ Confirm Password ]"
                >

                <br><br>


                <button type="submit">
                    CREATE ACCOUNT
                </button>

            </form>

        </section>


        <p>
            Already have an account?
            <a href="login.html">LOGIN</a>
        </p>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            ABOUT | FAQ | CONTACT | FEEDBACK
        </p>

        <p>
            © 2026 STUDENTHUB
        </p>

    </footer>

</body>

</html>
