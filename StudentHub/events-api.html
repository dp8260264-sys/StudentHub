<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practical 13 - StudentHub Events</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #243b64;
        }

        .panel {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000d;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd2df;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            padding: 10px 14px;
            margin: 12px 5px 0 0;
            border: 0;
            border-radius: 6px;
            background: #2458a6;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .danger {
            background: #c0392b;
        }

        .secondary {
            background: #5c6470;
        }

        .message {
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            display: none;
        }

        .success {
            display: block;
            background: #dff5e5;
            color: #155d2c;
        }

        .error {
            display: block;
            background: #ffe3e3;
            color: #8b1e1e;
        }

        .loading {
            display: block;
            background: #e3edff;
            color: #244a82;
        }

        .search {
            max-width: 420px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #e9eef8;
        }

        .status-open {
            color: #18743a;
            font-weight: bold;
        }

        .status-closed {
            color: #a02b2b;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .panel {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
<main class="container">
    <h1>StudentHub — Event Management</h1>
    
    <div id="message" class="message" role="status"
         aria-live="polite"></div>

    <section class="panel">
        <h2 id="formHeading">Add New Event</h2>

        <form id="eventForm">
            <input type="hidden" id="eventId">

            <label for="title">Event Title</label>
            <input id="title" maxlength="150" required>

            <label for="category">Category</label>
            <input id="category" maxlength="80"
                   placeholder="Workshop, Festival, Sports" required>

            <label for="eventDate">Event Date</label>
            <input id="eventDate" type="date" required>

            <label for="description">Description</label>
            <textarea id="description" required></textarea>

            <label for="status">Status</label>
            <select id="status">
                <option value="open">Open</option>
                <option value="closed">Closed</option>
            </select>

            <button id="saveButton" type="submit">
                Add Event
            </button>

            <button id="cancelButton" class="secondary"
                    type="button" hidden>
                Cancel Edit
            </button>
        </form>
    </section>

    <section class="panel">
        <h2>Event List</h2>

        <label for="search">Search Events</label>
        <input class="search" id="search"
               placeholder="Type an event title or category...">

        <button id="refreshButton" type="button">
            Refresh List
        </button>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="eventTable">
                    <tr>
                        <td colspan="7">Loading events...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const API_URL = "api/events.php";

    const form = document.getElementById("eventForm");
    const messageBox = document.getElementById("message");
    const tableBody = document.getElementById("eventTable");
    const searchInput = document.getElementById("search");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");

    let searchTimer;

    function showMessage(text, type = "success") {
        messageBox.textContent = text;
        messageBox.className = "message " + type;
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            const replacements = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return replacements[char];
        });
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, options);

        let result;

        try {
            result = await response.json();
        } catch {
            throw new Error("The server did not return valid JSON.");
        }

        if (!response.ok || result.success !== true) {
            throw new Error(
                result.message || "The request failed."
            );
        }

        return result;
    }

    async function loadEvents(search = "") {
        tableBody.innerHTML =
            '<tr><td colspan="7">Loading events...</td></tr>';

        showMessage("Loading events...", "loading");

        try {
            const url = new URL(API_URL, window.location.href);

            if (search.trim() !== "") {
                url.searchParams.set("q", search.trim());
            }

            const result = await apiRequest(url.toString());

            renderEvents(result.data || []);

            showMessage(
                result.message + " Total: " + result.data.length,
                "success"
            );
        } catch (error) {
            tableBody.innerHTML =
                '<tr><td colspan="7">Could not load events.</td></tr>';

            showMessage(error.message, "error");
        }
    }

    function renderEvents(events) {
        if (events.length === 0) {
            tableBody.innerHTML =
                '<tr><td colspan="7">No events found.</td></tr>';
            return;
        }

        tableBody.innerHTML = events.map(function (event) {
            const statusClass = event.status === "open"
                ? "status-open"
                : "status-closed";

            return `
                <tr>
                    <td>${escapeHTML(event.id)}</td>
                    <td>${escapeHTML(event.title)}</td>
                    <td>${escapeHTML(event.category)}</td>
                    <td>${escapeHTML(event.event_date)}</td>
                    <td>${escapeHTML(event.description)}</td>
                    <td class="${statusClass}">
                        ${escapeHTML(event.status)}
                    </td>
                    <td>
                        <button type="button"
                            data-action="edit"
                            data-id="${escapeHTML(event.id)}">
                            Edit
                        </button>

                        <button type="button" class="danger"
                            data-action="delete"
                            data-id="${escapeHTML(event.id)}">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    function resetForm() {
        form.reset();
        document.getElementById("eventId").value = "";
        document.getElementById("formHeading").textContent =
            "Add New Event";
        saveButton.textContent = "Add Event";
        cancelButton.hidden = true;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const id = document.getElementById("eventId").value;

        const payload = {
            action: id ? "update" : "create",
            title: document.getElementById("title").value.trim(),
            category: document.getElementById("category").value.trim(),
            event_date: document.getElementById("eventDate").value,
            description: document.getElementById("description").value.trim(),
            status: document.getElementById("status").value
        };

        if (id) {
            payload.id = Number(id);
        }

        saveButton.disabled = true;
        showMessage("Saving event...", "loading");

        try {
            const result = await apiRequest(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            showMessage(result.message, "success");
            resetForm();

            await loadEvents(searchInput.value);
        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            saveButton.disabled = false;
        }
    });

    tableBody.addEventListener("click", async function (event) {
        const button = event.target.closest("button[data-action]");

        if (!button) {
            return;
        }

        const id = Number(button.dataset.id);
        const action = button.dataset.action;

        if (action === "edit") {
            try {
                const result = await apiRequest(API_URL);
                const selected = result.data.find(function (item) {
                    return Number(item.id) === id;
                });

                if (!selected) {
                    throw new Error("Event not found.");
                }

                document.getElementById("eventId").value = selected.id;
                document.getElementById("title").value = selected.title;
                document.getElementById("category").value = selected.category;
                document.getElementById("eventDate").value =
                    selected.event_date;
                document.getElementById("description").value =
                    selected.description;
                document.getElementById("status").value = selected.status;

                document.getElementById("formHeading").textContent =
                    "Update Event";
                saveButton.textContent = "Update Event";
                cancelButton.hidden = false;

                document.getElementById("formHeading").scrollIntoView({
                    behavior: "smooth"
                });
            } catch (error) {
                showMessage(error.message, "error");
            }
        }

        if (action === "delete") {
            if (!confirm("Are you sure you want to delete this event?")) {
                return;
            }

            button.disabled = true;
            showMessage("Deleting event...", "loading");

            try {
                const result = await apiRequest(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        action: "delete",
                        id: id
                    })
                });

                showMessage(result.message, "success");
                await loadEvents(searchInput.value);
            } catch (error) {
                showMessage(error.message, "error");
                button.disabled = false;
            }
        }
    });

    cancelButton.addEventListener("click", function () {
        resetForm();
        showMessage("Edit cancelled.", "success");
    });

    document.getElementById("refreshButton")
        .addEventListener("click", function () {
            loadEvents(searchInput.value);
        });

    // Intermediate extension: AJAX search with debounce
    searchInput.addEventListener("input", function () {
        clearTimeout(searchTimer);

        searchTimer = setTimeout(function () {
            loadEvents(searchInput.value);
        }, 300);
    });

    // Load the records when the page first opens
    loadEvents();
</script>
</body>
</html>
